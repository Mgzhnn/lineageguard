name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm run audit:security

      - name: Verify application and distributable SDK
        run: pnpm run verify

      # Pack while the build Node.js is still active: pnpm 11 requires Node.js
      # 22.13, so no step below this line may invoke pnpm.
      - name: Pack the SDK for the Node.js 20 floor check
        run: pnpm --dir sdk pack --pack-destination "${{ runner.temp }}/sdk-pack"

      - name: Install the SDK's minimum supported Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.20.0

      - name: Import the packed SDK on Node.js 20
        run: node scripts/smoke-packed-sdk.mjs "${{ runner.temp }}/sdk-pack"
