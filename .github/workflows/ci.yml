name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm run audit:security

      - name: Verify application and distributable SDK
        run: pnpm run verify

      # Pack while the build Node.js is still active: pnpm 11 requires Node.js
      # 22.13, so no step below this line may invoke pnpm.
      - name: Pack the SDK for the Node.js 20 floor check
        run: pnpm --dir sdk pack --pack-destination "${{ runner.temp }}/sdk-pack"

      - name: Install the SDK's minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.0

      - name: Import the packed SDK on Node.js 20
        run: node scripts/smoke-packed-sdk.mjs "${{ runner.temp }}/sdk-pack"
