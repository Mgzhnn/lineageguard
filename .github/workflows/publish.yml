name: Publish SDK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be pushed from any commit. Only publish what main contains.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same Node.js as CI so the release is verified on what PRs ran.
          node-version: 22.13.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Audit high-severity dependency advisories
        run: pnpm run audit:security

      - name: Verify application and distributable SDK
        run: pnpm run verify

      - name: Pack the SDK for the Node.js 20 floor check
        run: pnpm --dir sdk pack --pack-destination "${{ runner.temp }}/sdk-pack"

      - name: Import the packed SDK on Node.js 20
        run: |
          NODE20="$(mktemp -d)"
          curl -fsSL "https://nodejs.org/dist/v20.20.0/node-v20.20.0-linux-x64.tar.xz" | tar -xJ -C "$NODE20" --strip-components=1
          "$NODE20/bin/node" scripts/smoke-packed-sdk.mjs "${{ runner.temp }}/sdk-pack"

      # npm trusted publishing needs npm 11.5.1+ and Node.js 22.14+, which the
      # CI floor does not bundle. Verification above already ran on the floor.
      - name: Install Node.js for publishing and configure npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm to a trusted-publishing release
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish with npm trusted publishing
        working-directory: sdk
        # Prerelease tags (v1.0.0-rc.1) must not become "latest".
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
