name: Publish SDK

on:
  push:
    tags:
      - "v*.*.*"

# Two jobs. "verify" runs every check, packs the SDK once and uploads that
# tarball; it has no id-token, so install scripts, the build and downloaded
# tools there cannot mint npm credentials. "publish" alone can, and it
# publishes the exact tarball that was verified: `npm publish <file>` runs no
# lifecycle scripts, so nothing is rebuilt between the checks and npm
# (2026-10-22 review).
permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be pushed from any commit. Only publish what main contains.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node.js as CI so the release is verified on what PRs ran.
          node-version: 22.13.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Audit high-severity dependency advisories
        run: pnpm run audit:security

      - name: Verify application and distributable SDK
        run: pnpm run verify

      - name: Pack the SDK once
        id: pack
        run: |
          mkdir -p "${{ runner.temp }}/sdk-pack"
          pnpm --dir sdk pack --pack-destination "${{ runner.temp }}/sdk-pack"
          tarball="$(cd "${{ runner.temp }}/sdk-pack" && ls *.tgz)"
          [ "$(echo "$tarball" | wc -l)" = 1 ] || { echo "::error::Expected one SDK tarball."; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Import the packed SDK on Node.js 20
        run: |
          NODE20="$(mktemp -d)"
          cd "$NODE20"
          curl -fsSLO "https://nodejs.org/dist/v20.20.0/node-v20.20.0-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v20.20.0/SHASUMS256.txt"
          grep " node-v20.20.0-linux-x64.tar.xz\$" SHASUMS256.txt | sha256sum -c -
          tar -xJf node-v20.20.0-linux-x64.tar.xz --strip-components=1
          cd "$GITHUB_WORKSPACE"
          "$NODE20/bin/node" scripts/smoke-packed-sdk.mjs "${{ runner.temp }}/sdk-pack"

      - name: Keep the verified tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the verified tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: sdk-pack

      # npm trusted publishing needs npm 11.5.1+ and Node.js 22.14+, which the
      # CI floor does not bundle. Verification above already ran on the floor.
      - name: Install Node.js for publishing and configure npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm to a trusted-publishing release
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Publish the verified tarball with npm trusted publishing
        env:
          # The leading ./ matters: without it npm reads "sdk-pack/x.tgz" as a
          # GitHub user/repo shorthand.
          TARBALL: ./sdk-pack/${{ needs.verify.outputs.tarball }}
        # Prerelease tags (v1.0.0-rc.1) must not become "latest".
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish "$TARBALL" --access public --tag next
          else
            npm publish "$TARBALL" --access public
          fi
