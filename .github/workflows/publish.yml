name: Publish SDK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js and configure npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package versions
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Audit high-severity dependency advisories
        run: pnpm run audit:security

      - name: Verify application and distributable SDK
        run: pnpm run verify

      - name: Publish with npm trusted publishing
        working-directory: sdk
        run: npm publish --access public
